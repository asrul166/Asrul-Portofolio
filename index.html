    <script>
      // pasang tema sebelum halaman digambar, supaya tidak berkedip
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        // pengunjung baru selalu light; dark hanya kalau pernah dipilih
        if (t !== "dark") t = "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
