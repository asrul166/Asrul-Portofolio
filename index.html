<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- tolak dark mode paksa dari browser (Chrome Android, Samsung Internet, dll.) -->
    <meta name="color-scheme" content="only light" />
    <meta name="description" content="Asrul — Informatics Engineering student. ERPNext/Frappe, Mobile, Python & AI/ML." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Asrul — Portfolio</title>

    <!-- preview saat link dibagikan (WhatsApp, LinkedIn, X, dll.).
         %SITE_URL% diisi otomatis saat build (lihat vite.config.js) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Asrul — Portfolio" />
    <meta property="og:title" content="Asrul — Portfolio" />
    <meta property="og:description" content="Informatics Engineering student from Makassar. Web, Mobile, and ERPNext/Frappe projects." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ASRUL — From ideas to interfaces, from code to solutions" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Asrul — Portfolio" />
    <meta name="twitter:description" content="Informatics Engineering student from Makassar. Web, Mobile, and ERPNext/Frappe projects." />
    <meta name="twitter:image" content="%SITE_URL%/share.png" />
    <script>
      // pasang tema sebelum halaman digambar, supaya tidak berkedip
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        // pengunjung baru selalu light; dark hanya kalau pernah dipilih
        if (t !== "dark") t = "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
